<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather / Update — Under Maintenance</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #080a0f;
            --card: #10131a;
            --border: rgba(255, 255, 255, 0.08);
            --text: #f5f5f5;
            --muted: #8b919e;
            --accent: #7c8cff;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(124, 140, 255, 0.12),
                    transparent 35%
                ),
                var(--bg);
            color: var(--text);
            font-family: "DM Sans", sans-serif;
            overflow: hidden;
        }

        .maintenance {
            width: min(600px, 90%);
            text-align: center;
            padding: 50px 35px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: rgba(16, 19, 26, 0.88);
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
        }

        .icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(124, 140, 255, 0.1);
            border: 1px solid rgba(124, 140, 255, 0.2);
            font-size: 42px;
        }

        .eyebrow {
            margin-bottom: 10px;
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 15px;
            font-family: "Syne", sans-serif;
            font-size: clamp(32px, 6vw, 52px);
            line-height: 1.05;
            font-weight: 700;
        }

        .message {
            max-width: 470px;
            margin: 0 auto;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.7;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-top: 30px;
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 999px;
            color: #c7cbd4;
            font-size: 13px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f0b429;
            box-shadow: 0 0 12px rgba(240, 180, 41, 0.6);
        }

        .footer {
            margin-top: 30px;
            color: #555b68;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .maintenance {
                padding: 40px 24px;
            }

            .icon {
                width: 75px;
                height: 75px;
                font-size: 34px;
            }

            .message {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <main class="maintenance">

        <div class="icon">
            🔧
        </div>

        <div class="eyebrow">
            Weather / Update
        </div>

        <h1>
            Under Maintenance
        </h1>

        <p class="message">
            We're currently working on the weather system.
            Forecast and weather features are temporarily unavailable.
            Please check back later.
        </p>

        <div class="status">
            <span class="status-dot"></span>
            System temporarily unavailable
        </div>

        <div class="footer">
            Weather / Update
        </div>

    </main>

</body>

</html>
