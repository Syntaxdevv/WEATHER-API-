<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather / Update</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0d11;
            color: #ffffff;
            font-family: "DM Sans", sans-serif;
        }

        .maintenance {
            width: 90%;
            max-width: 520px;
            text-align: center;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .label {
            margin-bottom: 8px;
            color: #7f8cff;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 15px;
            font-size: 42px;
            font-weight: 700;
        }

        p {
            color: #9298a3;
            font-size: 15px;
            line-height: 1.6;
        }

        .line {
            width: 50px;
            height: 2px;
            margin: 25px auto;
            background: #7f8cff;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #777e8a;
            font-size: 13px;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #e0a832;
        }

        .brand {
            margin-top: 35px;
            color: #4f5560;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 34px;
            }

            p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="maintenance">
        <div class="icon">🔧</div>
        <div class="label">
            Weather / Update
        </div>

        <h1>Under Maintenance</h1>

        <p>
            We're currently working on the weather system.
            Forecast and other weather features are temporarily unavailable.
            Please check back later.
        </p>

        <div class="line"></div>

        <div class="status">
            <span class="dot"></span>
            Temporarily unavailable
        </div>

        <div class="brand">
            Weather / Update
        </div>

    </div>

</body>
</html>
